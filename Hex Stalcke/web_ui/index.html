<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Stalcke AI - Commander</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff1e1e;
            --secondary: #b71c1c;
            --accent: #ff5252;
            --bg: #090000;
            --surface: rgba(45, 0, 0, 0.6);
            --text: #fffde7;
            --text-dim: #ff8a80;
            --glass-border: rgba(255, 82, 82, 0.2);
            --success: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(183, 28, 28, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 30, 30, 0.1), transparent 25%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Glassmorphism */
        .glass {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            background: linear-gradient(180deg, rgba(183,28,28,0.3) 0%, rgba(9,0,0,0) 100%);
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff8a80, #ff1e1e, #ff8a80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            animation: fadeIn 1s ease-out;
        }

        /* Server Status */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(0, 230, 118, 0.1);
            color: var(--success);
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid rgba(0, 230, 118, 0.3);
            margin-top: 1rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* Form Area */
        .panel {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel h2 {
            font-size: 1.2rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 30, 30, 0.3);
        }

        select option {
            background: var(--bg);
            color: var(--text);
        }

        button.cyber-btn {
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button.cyber-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        button.cyber-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 30, 30, 0.4);
        }

        button.cyber-btn:hover::before {
            left: 100%;
        }

        button.cyber-btn:active {
            transform: translateY(1px);
        }

        /* Terminal Display */
        .terminal-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .terminal-header {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 16px;
            border-radius: 16px 16px 0 0;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            gap: 8px;
        }

        .mac-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .mac-btn.close { background: #ff5f56; }
        .mac-btn.min { background: #ffbd2e; }
        .mac-btn.max { background: #27c93f; }

        .terminal-body {
            flex: 1;
            background: rgba(10, 5, 5, 0.8);
            padding: 1.5rem;
            border-radius: 0 0 16px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #a9b7c6;
            overflow-y: auto;
            max-height: 500px;
        }

        .terminal-body::-webkit-scrollbar {
            width: 8px;
        }

        .terminal-body::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
        }

        .terminal-body::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 4px;
        }

        .log-line {
            margin-bottom: 6px;
            word-wrap: break-word;
        }

        .log-info { color: #51c4d3; }
        .log-success { color: #a9dc76; }
        .log-error { color: #ff6188; font-weight: bold; }
        .log-warn { color: #ffd866; }

        /* Loader */
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 230, 118, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Hex Stalcke</h1>
        <div class="subtitle">Blood-Red Offensive Intelligence Core v6.0</div>
        <div class="status-badge" id="server-status">
            <div class="status-dot"></div>
            Connecting...
        </div>
    </header>

    <main>
        <!-- Left Panel: Controls -->
        <aside class="panel glass">
            <h2>🎯 Target Setup</h2>
            
            <div class="input-group">
                <label for="targetUrl">Target Domain / IP</label>
                <input type="text" id="targetUrl" placeholder="ex: example.com" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="analysisType">Analysis Mode</label>
                <select id="analysisType">
                    <option value="comprehensive">Comprehensive Scan</option>
                    <option value="reconnaissance">Reconnaissance</option>
                    <option value="vulnerability">Vulnerability Scan</option>
                    <option value="api">API Security Check</option>
                    <option value="frontend_generator">Frontend Generator (Site Cloner)</option>
                </select>
            </div>

            <button class="cyber-btn" id="launchBtn" onclick="launchAttack()">
                <span id="btnText">Launch Operation 🚀</span>
                <div class="loader" id="btnLoader"></div>
            </button>
        </aside>

        <!-- Right Panel: Terminal -->
        <section class="terminal-container glass">
            <div class="terminal-header">
                <div class="mac-btn close"></div>
                <div class="mac-btn min"></div>
                <div class="mac-btn max"></div>
            </div>
            <div class="terminal-body" id="terminal">
                <div class="log-line log-info">System initialized. Awaiting commands...</div>
                <div class="log-line">---</div>
            </div>
        </section>
    </main>

    <script>
        const terminal = document.getElementById('terminal');
        const launchBtn = document.getElementById('launchBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');

        function appendLog(message, type = '') {
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            const time = new Date().toLocaleTimeString('en-US', {hour12: false});
            line.textContent = `[${time}] ${message}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function checkHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                const badge = document.getElementById('server-status');
                if (data.status === 'healthy') {
                    badge.innerHTML = '<div class="status-dot"></div> API ONLINE (150+ Modules)';
                } else {
                    badge.innerHTML = '<div class="status-dot" style="background:#ff1e1e;"></div> API OFFLINE';
                    badge.style.color = '#ff1e1e';
                    badge.style.borderColor = 'rgba(255, 30, 30, 0.3)';
                    badge.style.background = 'rgba(255, 30, 30, 0.1)';
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Run health check initially
        checkHealth();
        setInterval(checkHealth, 10000);

        async function launchAttack() {
            const target = document.getElementById('targetUrl').value.trim();
            const analysisType = document.getElementById('analysisType').value;

            if (!target) {
                appendLog("Error: Missing target domain or IP.", "log-error");
                return;
            }

            // Set UI state
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            launchBtn.disabled = true;

            appendLog(`Initiating ${analysisType.toUpperCase()} on target: ${target}...`, "log-info");
            
            try {
                const response = await fetch('/api/intelligence/analyze-target', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        target: target,
                        analysis_type: analysisType
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.success !== false) {
                    appendLog(`Success: Attack chain constructed and executed.`, "log-success");
                    appendLog(`Report snippet: \n${JSON.stringify(data, null, 2)}`, "");
                } else {
                    appendLog(`Failure handling target: ${data.error || 'Unknown Backend Error'}`, "log-error");
                }
            } catch (error) {
                appendLog(`Critical Error establishing connection: ${error.message}`, "log-error");
            } finally {
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
                launchBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
