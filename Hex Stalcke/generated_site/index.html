  <script>
    // ERROR SPY - Captura erros que causam tela branca
    window.onerror = function(msg, url, line, col, error) {
      const err = `[FATAL ERROR] ${msg} at ${url}:${line}:${col}`;
      console.log('%c' + err, 'background: red; color: white; font-size: 20px;');
      document.body.innerHTML = `<div style="background:#222;color:#ff4444;padding:20px;font-family:monospace;height:100vh;">
        <h1 style="border-bottom:1px solid #444">❌ JavaScript Crash Detectado</h1>
        <pre style="white-space:pre-wrap;font-size:14px;">${err}\n\nStack:\n${error ? error.stack : 'N/A'}</pre>
      </div>`;
      return false;
    };
    console.error = (function(old) {
      return function() {
        old.apply(console, arguments);
        const msg = Array.from(arguments).join(' ');
        const log = document.createElement('div');
        log.style.color = '#ffa500';
        log.style.fontSize = '12px';
        log.style.padding = '2px';
        log.innerText = '[CONSOLE.ERROR] ' + msg;
        if (document.body) document.body.appendChild(log);
      };
    })(console.error);
  </script>
